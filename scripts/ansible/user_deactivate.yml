---
# Script to deactivate a system user on the servers
#
# To run the script:
# ansible-playbook -K deactivate_user.yml -i hosts-xxx -e 'target=targethost login=username'
# ansible-playbook -K deactivate_user.yml -i hosts-xxx -e 'target=targethost login=username' --limit=*.mydomain.com
#

- name: Create user on target system(s)
  hosts: '{{target}}'
  become: yes
  become_user: root
  tasks:
  # Expire the account today (UTC date of the server) instead of -E0, so the date of deactivation is kept.
  # The account is refused as soon as the current UTC day is >= the expiration day, so it is blocked immediately.
  - name: Deactivate system user
    shell: "chage -E $(date -u +%Y-%m-%d) {{ login | quote }}"
    register: command_output

  - debug:
      var: command_output.stdout_lines
